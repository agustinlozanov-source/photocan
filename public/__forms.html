<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Formularios</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify detecta aquí los formularios del sitio. El formulario visible está en components/FormularioContacto.tsx. -->
<form name="contacto" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input name="nombre">
  <input name="whatsapp">
  <input name="correo" type="email">
  <input name="negocio">
  <input name="acepta_privacidad">
  <input name="origen">
  <input name="pagina">
  <input name="referencia">
  <input name="utm_source">
  <input name="utm_medium">
  <input name="utm_campaign">
  <input name="utm_content">
  <input name="utm_term">
</form>
</body>
</html>
