[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # Exportación estática: no hace falta el runtime de Next en Netlify.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# phot8can.studio era el dominio de la página de bodas: todo se va a phot8can.com/bodas/.
# Descomentar SOLO cuando phot8can.com ya esté conectado y con HTTPS en Netlify.
